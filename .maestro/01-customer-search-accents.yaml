# Customer list filter must ignore accents and case (SQL-side folding).
appId: br.com.artemis
tags: [qa]
---
- runFlow: subflows/open-app.yaml
- tapOn: Clientes
- extendedWaitUntil:
    visible: ".* - SP.*"
    timeout: 30000
- tapOn:
    point: 79%,8%
- tapOn: Pesquisar por loja ou contato...
- inputText: sao judas
- hideKeyboard
- tapOn: Aplicar Filtros
- extendedWaitUntil:
    visible: Mercado São Judas
    timeout: 15000
- assertNotVisible: 100 Miseria Lanches
- takeScreenshot: 01-customer-search-accents
